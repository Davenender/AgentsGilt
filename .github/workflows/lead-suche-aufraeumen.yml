name: Lead-Suche aufräumen

# Löscht stündlich die Meldungen "… hat gesucht" in #lead-suche, die älter als 24 Stunden sind,
# und alte Einträge im Merkzettel der Lead-Suche. GitHub führt geplante Läufe manchmal mit Verspätung aus.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - name: Aufräumen abrufen
        run: curl -fsS --max-time 60 -X POST https://agentsgilt.com/api/lead-suche/aufraeumen
