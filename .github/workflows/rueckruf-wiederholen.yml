name: Rückruf wiederholen

# Startet geplante Rückrufe des KI-Assistenten (nicht erreichte Kunden) alle 30 Minuten neu.
# Es wird nur zwischen 8 und 22 Uhr angerufen, das prüft der Server. GitHub führt geplante Läufe manchmal mit Verspätung aus.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  wiederholen:
    runs-on: ubuntu-latest
    steps:
      - name: Wiederholungen abrufen
        run: curl -fsS --max-time 60 -X POST https://agentsgilt.com/api/rueckruf/wiederholen
